  <title id="cf-arch-title">CodeForge Android v2.0 系统架构图</title>
  <desc id="cf-arch-desc">展示入口与界面层、OpenRender JNI 渲染层、ChatViewModel 状态层、协议传输层、手机操控环回 MCP 层与 Go 内核进程及 Alpine 沙箱层的单向数据流与协同关系。</desc>

